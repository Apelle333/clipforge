name: Bug report
description: Report a reproducible local problem without private media.
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Steps, expected result and actual result
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: OS, Python, FFmpeg, GPU and selected models
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed secrets, private media, transcripts and personal paths.
          required: true
