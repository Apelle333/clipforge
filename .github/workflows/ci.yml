name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg-full -y --no-progress
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
      - name: Install isolated dependencies
        run: |
          python -m pip install 'pip>=26.2.2'
          python -m pip install -r requirements-cpu.lock.txt
      - name: Backend tests (optional real-ASR/E2E fixtures skip in CI)
        run: python -m pytest -q --tb=short
      - name: Dependency advisories
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --test tests/editor-actions.test.mjs
      - run: npm run build
      - run: npm audit --audit-level=low
