name: clipforge
services:
  clipforge:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: cpu
    ports:
      - '127.0.0.1:${CLIPFORGE_PORT:-8078}:8000'
    environment:
      AUTOCLIP_HOME: /data
      HF_HOME: /data/huggingface
      CUDA_VISIBLE_DEVICES: '-1'
      CLIPFORGE_CPU: '1'
      CLIPFORGE_MAX_UPLOAD_BYTES: '${CLIPFORGE_MAX_UPLOAD_BYTES:-5368709120}'
    volumes:
      - clipforge-data:/data
    init: true
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
  ollama:
    image: ollama/ollama:0.40.11@sha256:dea72d1e22270fe095b68fdf756d2b489d615643c5a2eaebbc5f569181e322d8
    network_mode: 'service:clipforge'
    environment:
      OLLAMA_HOST: '127.0.0.1:11436'
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
      OLLAMA_NUM_PARALLEL: '1'
    volumes:
      - ollama-models:/root/.ollama
    security_opt:
      - no-new-privileges:true
volumes:
  clipforge-data:
  ollama-models:
